schema_version: 2
scientific_question: Search binary tree space for lower Fitch parsimony cost without claiming that the
  objective identifies true history.
artifact: A Newick topology containing every supplied taxon exactly once.
oracle:
  model: Exact unordered Fitch scoring on deterministic procedural alignments.
  feasibility: The independent parser requires a finite-size strictly binary tree with exact leaf coverage.
  deterministic: true
normalization:
  baseline: Deterministic caterpillar topology normalizes to zero.
  reference: 'Unchanged UPGMA after label permutation: 0.938471597 development, 0.934821429 held-out.
    Withdrawn calibration.'
  score: Clipped caterpillar-gap closure toward the sum of per-site distinct-state lower bounds; no uncapped
    claim.
citations:
- id: doi:10.1111/j.1096-0031.1999.tb00277.x
  title: The Parsimony Ratchet, a New Method for Rapid Parsimony Analysis
- id: doi:10.1186/s12859-018-2009-1
  title: 'MPBoot: fast phylogenetic maximum parsimony tree inference and bootstrap approximation'
invariants:
- Leaf-order and internal-node naming do not enter the parsimony objective.
- Every taxon appears exactly once and multifurcations are invalid.
- Small trees are cross-checkable by topology enumeration.
known_shortcuts: 'Independently permuted taxon-to-sequence assignments and input rows using a separate
  deterministic RNG. The underlying sequence multiset is unchanged. Regression coverage includes arbitrary
  renaming, row reordering, the label-only block probe and twenty additional fixed generator seeds.  On
  the five scored instances after repair:  | Solver | Development | Held-out | | --- | ---: | ---: | |
  Label-only blocks | 0.065333826 | 0.006547619 | | UPGMA reference | 0.938471597 | 0.934821429 | | UPGMA
  + NNI | 0.943260352 | 0.943452381 |  The original label-only result was 0.667610. Although label leakage
  is repaired, removing the structured labels also makes the caterpillar baseline substantially worse.
  The unchanged UPGMA reference now closes almost the entire baseline gap; NNI adds less than one percentage
  point on both splits. This family is therefore withdrawn. No new denominator, weaker reference, or reachable-top
  claim was added to force a 0.5–0.8 score. The existing sitewise bound remains a relaxation and is not
  asserted jointly attainable.'
