schema_version: 2
scientific_question: Coarse backbone distance geometry with handedness constraints
artifact: Return the strict typed artifact specified in Task.md.
oracle:
  model: Public interval, bond-angle, excluded-volume and signed-volume losses
  feasibility: Strict output validation; trusted oracle recomputation; resource violations fail closed.
  deterministic: true
  determinism_scope: Scoring fixed submitted coordinates in a fixed numerical environment.
  reference_reproducible_across_platforms: false
  reproducibility: Fixed inputs and numerical environment; reference optimization is sensitive
    to BLAS configuration. See references/known_best.md for repeatability measurements.
normalization:
  baseline: Legal baseline in solution.py scores exactly zero.
  reference: Shortest paths, MDS, reflection selection and 45 least-squares evaluations; a 120-evaluation
    probe improves the loss.
  score: Clipped inverse-loss quality q=1/(1+L/0.2), normalized from straight-line baseline to zero
    public constraint loss.
citations:
- id: doi:10.1023/A:1008380219900
  title: Distance Geometry Optimization for Protein Structures
invariants:
- Frozen procedural worlds and deterministic oracle.
- Candidate mutations do not modify trusted scoring inputs.
known_shortcuts: >-
  Zero-loss procedural witnesses exist. MDS plus longer least squares improves the reference; real protein folding and external DGSOL comparisons remain out of scope. Independent reproduction: fixed ideal helix scored 0.820435; its mirror 0.061669; helix plus 20 evaluations 0.999992; plus 45 evaluations reached development/held-out 1.0 with zero loss in all four worlds (16 seconds on this host). Current helix family is saturated and requires replacement or withdrawal.
