    branches of 0.12 to 0.2 coalescent units was not anomalous by simulation; the range is now 0.1
    to 0.16, verified on every world with one hundred thousand gene trees. At a budget of 400 the
    reference lost one development world by 0.2 quartet votes out of 243 and a strategy in the
    shortcut probe tied it on the development split at 0.779 against 0.774; the budget was raised
    to 480, at which the reference recovers every tree world and leads the whole probe on both
    splits.
