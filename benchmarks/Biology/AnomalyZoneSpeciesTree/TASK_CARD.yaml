novelty_risk:
  level: medium
  rationale: The anomaly zone (Degnan and Rosenberg 2006), the inconsistency of concatenation (Kubatko and Degnan 2007), quartet-based species-tree estimation (Allman, Degnan and Rhodes 2011; Mirarab et al. 2014) and long-branch attraction under uncorrected distances (Felsenstein 1978; Roch, Nute and Warnow 2019) are all published, and a model that knows them may reach for quartet consensus at once. What is not published is which loci to buy, that the free gene trees carry a systematic bias that also mimics the reticulation signature, and which worlds are reticulate. The ablation shows the score turns on combining the quartet insight with re-estimated gene trees, the right locus class and length, a refusal test and the budget rather than on recalling any one of them, and the shortcut probe bounds what a searcher gets from the free gene trees at 0.838 on the development split and 0.604 held out. No frontier draw has been run yet, so the difficulty at the frontier is not measured.
