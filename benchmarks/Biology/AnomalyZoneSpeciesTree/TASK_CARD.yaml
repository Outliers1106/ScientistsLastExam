invariants:
- every tree world is in the anomaly zone by measurement, not by assumption; over one hundred thousand simulated gene trees the species-tree topology ranks between third and twenty-seventh by frequency, with the gap to the top topology at least three standard errors
- no quartet is anomalous under the coalescent, and the reference's exhaustive quartet consensus is consistent where the most frequent gene tree, greedy consensus and concatenation are not; greedy consensus in its place loses 0.43 of the score
- the sequencing centre's gene trees use the plain Jukes-Cantor distance while sites evolve under gamma-distributed rates of published shape, so the two fast-evolving species attract each other on the faster loci and the free trees lose 0.56 of the score; the rate multipliers are unpublished, so the correction has to come from the published site-rate model, not from knowing which species are fast
- under any species tree the two minority topologies of a quartet are equally probable, so a hybrid is detectable only from the imbalance in the quartets that contain it; on the reference's loci the imbalance statistic is at most 82.6 on any tree world and at least 171.6 on any reticulate world, with the threshold at 115
- the catalogue prices length and not rate class, so the choice of rate class is a scientific choice and not a budgeting one; slow loci lose 0.08, fast loci 0.34, and the free gene trees on fast loci 0.78
- half the reference's budget costs 0.35 and a quarter scores zero on the development split, so the budget is not free
- declining every world scores exactly zero by construction, and so does naming one fixed tree everywhere; declining a tree world is a false discovery, not a shrug, because it claims a hybrid
- loci are charged and overspend fails closed; buying a locus twice returns the same data and is charged once; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: A sweep of 1260 low-dimensional strategies that take the free gene trees as given - one catalogue cell, topology by greedy consensus, the most frequent gene tree, neighbour joining on the mean Jukes-Cantor distance or quartet consensus, refusal never, on a discordance threshold or on the minority-imbalance statistic, and branch lengths constant or from the quartet frequencies - reaches 0.838 on the development split and 0.604 held out, against a reference of 0.877 and 0.929 and a ceiling of 1.0. The top strategy is neighbour joining on the mean distance over slow 300-site loci, which is a consistent method under the coalescent; it falls behind on branch lengths and collapses held out. Without quartet consensus and quartet lengths the sweep tops out at 0.744 and 0.509, on fast loci at 0.331, and never declining at 0.338. Every world seed is repository-visible and a future server-held split is required. The reference is deliberately not at the ceiling; its branch-length score is 0.75 because it does not correct the quartet frequencies for gene-tree estimation error, it weights every quartet equally, and it declines on a fixed threshold rather than a test of the fitted tree, so those axes retain headroom. The eight-taxon, one-genome-per-species setting with Jukes-Cantor sequences is a controlled research abstraction; gene flow between non-sister lineages, multiple hybrids, recombination within loci and missing data are out of scope.
